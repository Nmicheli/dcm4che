# Configuration of the dcm4che Backend for Frontend (BFF) for Keycloak / OpenID Connect.
#
# All entries can be overridden by servlet init parameters of the same name in
# WEB-INF/web.xml, so a deployment can be adapted without repackaging the archive.

# Issuer URL of the Keycloak realm, e.g.
# https://keycloak.example.com/realms/dcm4che
bff.issuer-uri=https://keycloak.example.com/realms/dcm4che

# Client registered in the realm; the client must have "Standard Flow" enabled,
# and bff.redirect-uri must be listed as a valid redirect URI.
bff.client-id=dcm4che-bff
# Leave empty for a public client relying on PKCE only.
bff.client-secret=

# The BFF callback, i.e. the servlet mapping of the BFF followed by /callback
bff.redirect-uri=https://dcm4che.example.com/bff/callback
# Where Keycloak sends the browser after the logout
bff.post-logout-redirect-uri=https://dcm4che.example.com/

bff.scope=openid profile email

# Idle timeout of a BFF session, in seconds
bff.session-timeout=3600

bff.cookie-name=DCM4CHE_BFF_SESSION
# Keep true in production: the cookie is then never sent over plain HTTP
bff.cookie-secure=true

# Base URI of the protected backend the BFF forwards authenticated requests to
bff.backend-uri=https://dcm4che.example.com/api

# URIs the BFF may redirect to after login, besides bff.redirect-uri;
# protects against open redirects
bff.allowed-redirect-uris=https://dcm4che.example.com/
